<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perpustakaan Taman Apel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="ap" viewBox="0 0 64 64"><path d="M32 18c-6-5-18-3-20 10-2 14 8 28 16 28 3 0 3-1 4-1s1 1 4 1c8 0 18-14 16-28-2-13-14-15-20-10z" fill="currentColor"/><path d="M32 18c0-6 2-10 6-12" stroke="#5B3A29" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M38 8c6-3 12 0 12 0s-4 6-12 4z" fill="#4E9A5B"/></symbol>
</svg>

<div class="wrap">
  <header class="top">
    <div class="brand"><svg style="color:var(--apple)"><use href="#ap"/></svg>Taman Apel</div>
    <button class="loans-btn" id="openLoans">Pinjaman saya<b id="count">0</b></button>
  </header>

  <section class="hero">
    <div>
      <h1>Baca sambil berteduh di bawah pohon apel.</h1>
      <p>Pilih buku dari dahan yang paling dekat, pinjam selama tujuh hari, dan kembalikan saat sudah selesai.</p>
      <form class="search" role="search" onsubmit="return false">
        <input id="q" type="search" placeholder="Cari judul atau penulis" aria-label="Cari judul atau penulis">
      </form>
    </div>
    <svg class="tree" viewBox="0 0 320 340" role="img" aria-label="Ilustrasi pohon apel berbuah merah">
      <rect x="140" y="190" width="40" height="120" rx="10" fill="#5B3A29"/>
      <path d="M160 230 L110 190 M160 240 L215 200" stroke="#5B3A29" stroke-width="12" stroke-linecap="round"/>
      <circle cx="160" cy="110" r="95" fill="#2F6B3C"/><circle cx="95" cy="150" r="60" fill="#3B7F49"/><circle cx="225" cy="150" r="62" fill="#3B7F49"/><circle cx="160" cy="70" r="50" fill="#4E9A5B"/>
      <g color="#C62E2B"><svg class="apple" x="90" y="100" width="40" height="40"><use href="#ap"/></svg><svg class="apple" x="190" y="90" width="40" height="40"><use href="#ap"/></svg><svg class="apple" x="140" y="150" width="40" height="40"><use href="#ap"/></svg><svg class="apple" x="215" y="165" width="36" height="36"><use href="#ap"/></svg><svg class="apple" x="60" y="165" width="36" height="36"><use href="#ap"/></svg></g>
      <ellipse cx="160" cy="314" rx="130" ry="14" fill="#2F6B3C"/>
    </svg>
  </section>
</div>

<div class="ground"></div>
<main class="shelf">
  <div class="wrap">
    <div class="shelf-head">
      <h2>Koleksi buku</h2>
      <div class="chips" id="chips" role="group" aria-label="Filter kategori"></div>
    </div>
    <div class="grid" id="grid" aria-live="polite"></div>
  </div>
</main>
<footer>Perpustakaan Taman Apel · Buka setiap hari, 08.00–17.00</footer>

<dialog id="dlg" aria-labelledby="dt">
  <h2 id="dt">Pinjaman saya</h2>
  <ul id="loanList"></ul>
  <button class="btn close" id="closeDlg">Tutup</button>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script src="script.js"></script>
</body>
</html>
